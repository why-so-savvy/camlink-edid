[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "camlink-edid"
version = "0.3.0"
description = "Unofficial tool to add a 2560x1440 @ 60 Hz mode to the EDID of an Elgato Cam Link 4K Rev.2 (USB 0FD9:007B)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "why-so-savvy" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.scripts]
camlink-edid = "camlink_edid.cli:main"

[project.gui-scripts]
camlink-edid-gui = "camlink_edid.gui:main"

[tool.setuptools]
packages = ["camlink_edid"]

[tool.setuptools.package-data]
camlink_edid = ["assets/*"]
